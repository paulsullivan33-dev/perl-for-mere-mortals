site_name: Perl for Mere Mortals
site_description: The classic glue language that still ships on almost every Unix machine. One-liners that take a log apart line by line, real scripts written under strict and warnings, named captures, core modules, tests run under prove, and one honest CPAN install, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/perl-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

